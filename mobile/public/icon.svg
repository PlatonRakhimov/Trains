<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Фон на весь квадрат: такую иконку Android может обрезать в круг/«каплю» (maskable). -->
  <rect width="512" height="512" fill="#1f6feb"/>
  <!-- Гантель в центральной «безопасной зоне» (80% от размера). -->
  <g fill="#ffffff">
    <rect x="150" y="238" width="212" height="36" rx="8"/>
    <rect x="112" y="176" width="44" height="160" rx="12"/>
    <rect x="356" y="176" width="44" height="160" rx="12"/>
    <rect x="80" y="206" width="36" height="100" rx="10"/>
    <rect x="396" y="206" width="36" height="100" rx="10"/>
  </g>
</svg>
