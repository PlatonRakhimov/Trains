<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Тренировки</title>
    <link rel="icon" href="./mobile/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #d1d5db;
        --primary: #1f6feb;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --card: #161b22;
          --text: #e6edf3;
          --muted: #8b949e;
          --border: #30363d;
          --primary: #2f81f7;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 32px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        margin: 0 0 8px;
      }
      a.card {
        display: block;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a.card:hover {
        border-color: var(--primary);
      }
      a.card strong {
        display: block;
        font-size: 19px;
        color: var(--primary);
      }
      p {
        margin: 4px 0 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Тренировки</h1>
      <a class="card" href="./mobile/">
        <strong>📱 Дневник в зале</strong>
        <p>Для телефона. Откройте в Chrome и установите на главный экран — дальше работает без интернета.</p>
      </a>
      <a class="card" href="./desktop/">
        <strong>📈 Анализ прогресса</strong>
        <p>Для компьютера. Загрузите файл workouts_….csv из экспорта — графики, сравнение циклов, застои.</p>
      </a>
    </main>
  </body>
</html>
